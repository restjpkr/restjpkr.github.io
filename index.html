<!DOCTYPE HTML>
<html>
	<head>
		<title>MANKIN</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#0d161a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="stylesheet" href="assets/css/rule.css" />
		<style>
			/* 데스크톱: 버튼과 저작권이 겹치지 않도록 푸터를 문서 흐름에 둔다 (모바일은 기존 그대로) */
			@media screen and (min-width: 981px) {
				#footer {
					position: static;
					margin: 3.5em 0 0 0;
				}
			}

			/* 규칙 목록: 번호 칸 고정 + 본문 칸 정렬 (2줄째도 번호 아래로 파고들지 않게) */
			#header .rules {
				margin: 0 0 1.5em 0;
				font-size: 1.35em;
				line-height: 1.65em;
			}
			#header .rule {
				display: flex;
				align-items: flex-start;
				gap: 8px;
			}
			#header .rule + .rule {
				margin-top: 1.1em;
			}
			#header .rule-num {
				flex: 0 0 auto;
				min-width: 18px;
			}
			#header .rule-body {
				flex: 1 1 auto;
				min-width: 0;
			}
			#header .rule-jp {
				line-break: strict;
			}
			#header .rule-kr {
				word-break: keep-all;
			}

			/* 모바일: 규칙 글자를 조금 줄이고 줄간격·들여쓰기를 정돈 */
			@media screen and (max-width: 736px) {
				#header .rules {
					font-size: 0.85em;
					line-height: 1.6em;
				}
				#header .rule + .rule {
					margin-top: 1.15em;
				}
			}

			/* 상단 헤더 바 (MANKIN PUB) */
			.page-topbar { position: relative; width: 100%; max-width: 700px; margin: 0 auto 1.6em; padding: 2px 0 0; text-align: center; }
			.page-topbar-title { display: inline-block; font-size: 1.32em; font-weight: 700; letter-spacing: 1.5px; line-height: 42px; color: #fff; }
			/* 화면 최상단 고정 (세로 중앙 본문과 분리) */
			body > .page-topbar { position: absolute; top: 20px; left: 20px; right: 20px; width: auto; max-width: 700px; margin: 0 auto; padding: 12px 0 0; z-index: 3; }
		
			/* iOS 안전영역·배경 꽉 채우기 (상태바/툴바 검은 띠 제거) */
			html, body { background-color: #0d161a; }
			body { min-height: 100dvh; }
			/* 움직이는 배경이 iOS 상태바·주소창 뒤까지 끊김 없이 이어지도록 위아래로 넘겨 깐다 */
			#bg { position: fixed; top: -80px; bottom: -80px; left: 0; right: 0; width: auto; height: auto; min-height: calc(100lvh + 160px); }
			#bg > div { position: absolute; top: 0; bottom: 0; left: 0; height: auto; min-height: 100%; width: 150%; }
			@media screen and (max-width: 736px) {
				body { padding-top: calc(5em + env(safe-area-inset-top)); padding-bottom: calc(2em + env(safe-area-inset-bottom)); }
			}
			@media screen and (min-width: 737px) {
				body { padding-top: calc(6em + env(safe-area-inset-top)); padding-bottom: calc(4em + env(safe-area-inset-bottom)); }
			}
		</style>
	</head>
	<body class="is-preload">

		<!-- 상단 헤더 바 -->
			<div class="page-topbar">
				<span class="page-topbar-title">MANKIN PUB</span>
			</div>

		<!-- Header -->
			<header id="header">
				<h1>ルール 규칙</h1>
					<p><b>必ず読んでください<br>
						꼭 읽어주세요</b></p>
				<div class="rules">
					<div class="rule">
						<span class="rule-num">1.</span>
						<div class="rule-body">
							<div class="rule-jp">1時間に1杯の注文をお願いします</div>
							<div class="rule-kr">1시간에 1잔 주문 부탁드립니다</div>
						</div>
					</div>
					<div class="rule">
						<span class="rule-num">2.</span>
						<div class="rule-body">
							<div class="rule-jp">注文がない場合、1時間あたり5,000ウォンのチャージ料が発生します</div>
							<div class="rule-kr">주문하지 않은 경우에는 1시간당 이용요금 5,000원 추가로 부과됩니다</div>
						</div>
					</div>
					<div class="rule">
						<span class="rule-num">3.</span>
						<div class="rule-body">
							<div class="rule-jp">VIPルーム(明洞店のみ)はボトル2本以上のご注文が必要です</div>
							<div class="rule-kr">VIP룸(명동점 한정)은 바틀 2병 이상 주문 필수입니다</div>
						</div>
					</div>
				</div>
			</header>

<p>
			<ul class="actions fit" style="margin: 0 0 14px 0; padding: 0 0 0 1em; list-style: none;">
				<a href="menu.html" class="button special fit">メニュー | 메뉴</a>
			</ul>
			<ul class="actions fit" style="margin: 0; padding: 0 0 0 1em; list-style: none;">
				<a href="info.html" class="button special fit">はじめての方へ | 혹시 처음이세요?</a>
			</ul>
</p>

		<!-- Footer -->
			<footer id="footer">
				<ul class="copyright">
					<li>&copy; マスターとあら</li>
				</ul>
			</footer>

		<!-- Scripts -->
			<script src="assets/js/main.js"></script>

	</body>
</html>
