					if (passInput.value.trim() === '2580') {

					} else {

				function init() {

					showNamePicker(false);

					});

						'<span class="ko">' + BOSS + '</span>' +
						'<span class="ja">不足</span>' +
						'</button>';
					nameList.innerHTML = html;
					var btns = nameList.querySelectorAll('.name-btn');
					for (var j = 0; j < btns.length; j++) {
						btns[j].addEventListener('click', function () {
							select(this.getAttribute('data-name'));
						});
					}
				}

				function select(name) {
					if (name !== BOSS) {
						var p = findPerson(name);
						if (!p) { return; }
					}
					current = name;
					var btns = nameList.querySelectorAll('.name-btn');
					for (var i = 0; i < btns.length; i++) {
						btns[i].classList.toggle('active', btns[i].getAttribute('data-name') === name);
					}
					whoName.textContent = name;
					if (name === BOSS) { renderShortage(); } else { render(findPerson(name)); }
					picker.style.display = 'none';
					document.body.classList.remove('picking');
					backTop.textContent = '← 이름 변경';
					result.style.display = 'block';
					window.scrollTo(0, 0);
				}

				/* ---------- 부족 시간 (점장) ---------- */
				var NEED_A = ['17:30', '19:30', '21:00'];
				var NEED_B = ['17:30', '19:00', '20:30', '21:30'];

				function needSlots(key) {
					var parts = key.split('-');
					var dow = new Date(+parts[0], +parts[1] - 1, +parts[2]).getDay();
					return (dow === 5 || dow === 6) ? NEED_B : NEED_A;
				}

				function buildShortage() {
					var table = {};
					for (var i = 0; i < DATA.staff.length; i++) {
						var days = DATA.staff[i].days;
						for (var key in days) {
							if (!Object.prototype.hasOwnProperty.call(days, key)) { continue; }
							if (DATA.months.indexOf(key.slice(0, 7)) < 0) { continue; }
							var ents = days[key];
							for (var j = 0; j < ents.length; j++) {
								var e = ents[j];
								if ((e.s === '상수' || e.s === '명동') && e.t) {
									table[key] = table[key] || { '상수': [], '명동': [] };
									table[key][e.s].push(e.t);
								}
							}
						}
					}
					var out = {};
					for (var k in table) {
						if (!Object.prototype.hasOwnProperty.call(table, k)) { continue; }
						var need = needSlots(k);
						var miss = {};
						var stores = ['상수', '명동'];
						for (var s = 0; s < stores.length; s++) {
							var st = stores[s];
							var have = table[k][st] || [];
							var lack = [];
							for (var n = 0; n < need.length; n++) {
								if (have.indexOf(need[n]) < 0) { lack.push(need[n]); }
							}
							if (lack.length) { miss[st] = lack; }
						}
						if (miss['상수'] || miss['명동']) { out[k] = miss; }
					}
					return out;
				}

				function renderShortage() {
					var tk = todayKey();
					var short = buildShortage();
					var html = '';
					for (var m = 0; m < DATA.months.length; m++) {
						html += monthCardShort(DATA.months[m], short, tk).html;
					}
					monthsEl.innerHTML = html;
				}

				function monthCardShort(ym, short, tk) {
					var y = +ym.slice(0, 4);
					var mo = +ym.slice(5, 7);
					var startDow = new Date(y, mo - 1, 1).getDay();
					var total = new Date(y, mo, 0).getDate();
					var cells = [];
					var count = 0;
					var i;

					for (i = 0; i < startDow; i++) { cells.push('<div class="day out"></div>'); }

					for (var d = 1; d <= total; d++) {
						var key = ym + '-' + pad2(d);
						var miss = short[key] || null;
						var s = miss && miss['상수'];
						var mn = miss && miss['명동'];
						var cls = 'day';
						if (s && mn) { cls += ' short-b'; }
						else if (s) { cls += ' short-s'; }
						else if (mn) { cls += ' short-m'; }
						if (key === tk) { cls += ' today'; }
						if (key < tk) { cls += ' past'; }
						if (s || mn) { count++; }

						var inner = '<span class="num">' + d + '</span>';
						if (s || mn) {
							var lines = '';
							var si, mi;
							for (si = 0; si < (s ? s.length : 0); si++) {
								lines += '<span class="sh s"><i>상</i>' + s[si] + '</span>';
							}
							for (mi = 0; mi < (mn ? mn.length : 0); mi++) {
								lines += '<span class="sh m"><i>명</i>' + mn[mi] + '</span>';
							}
							inner += '<span class="ent">' + lines + '</span>';
						} else {
							inner += '<span class="ent"></span>';
						}
						cells.push('<div class="' + cls + '">' + inner + '</div>');
					}

					var tail = (startDow + total) % 7;
					if (tail !== 0) {
						for (i = tail; i < 7; i++) { cells.push('<div class="day out"></div>'); }
					}

					var head = '<div class="month">' +
						'<div class="month-head"><h3>' + y + '년 ' + mo + '월</h3>' +
						'<span class="count">부족 <b>' + count + '</b>일</span></div>' +
						'<div class="dow"><i>일</i><i>월</i><i>화</i><i>수</i><i>목</i><i>금</i><i>토</i></div>' +
						'<div class="grid">' + cells.join('') + '</div></div>';

					return { html: head, count: count };
				}

				function render(p) {
					var tk = todayKey();
					var html = '';
					for (var m = 0; m < DATA.months.length; m++) {
						var ym = DATA.months[m];
						var mc = monthCard(ym, p, tk);
						html += mc.html;
					}
					monthsEl.innerHTML = html;
				}

				function monthCard(ym, p, tk) {
					var y = +ym.slice(0, 4);
					var mo = +ym.slice(5, 7);
					var startDow = new Date(y, mo - 1, 1).getDay();
					var total = new Date(y, mo, 0).getDate();
					var cells = [];
					var count = 0;
					var i;

					for (i = 0; i < startDow; i++) { cells.push('<div class="day out"></div>'); }

					for (var d = 1; d <= total; d++) {
						var key = ym + '-' + pad2(d);
						var ents = p.days[key] || [];
						var cls = 'day';
						var hasS = false, hasAny = false;

						for (i = 0; i < ents.length; i++) {
							if (ents[i].s === '상수') { hasS = true; }
							if (ents[i].s) { hasAny = true; }
						}
						if (hasS) { cls += ' has-s'; }
						else if (hasAny) { cls += ' has-m'; }
						if (key === tk) { cls += ' today'; }
						if (hasAny) { count++; }

						var inner = '<span class="num">' + d + '</span>';
						for (i = 0; i < ents.length; i++) {
							var e = ents[i];
							if (e.x === 'c') {
								inner += '<span class="ent"><span class="tm none">?</span></span>';
							} else {
								var sc = STORE_CLASS[e.s] || 'w';
								var sj = STORE_JA[e.s] || '';
								inner += '<span class="ent" title="' + (sj || '') + '">' +
									'<span class="st ' + sc + '">' + e.s + '</span>' +
									(e.t ? '<span class="tm">' + e.t + '</span>' : '<span class="tm none">—</span>') +
									'</span>';
							}
						}
						if (ents.length === 0) { inner += '<span class="ent"></span>'; }
						cells.push('<div class="' + cls + '">' + inner + '</div>');
					}

					var tail = (startDow + total) % 7;
					if (tail !== 0) {
						for (i = tail; i < 7; i++) { cells.push('<div class="day out"></div>'); }
					}

					var head = '<div class="month">' +
						'<div class="month-head"><h3>' + y + '년 ' + mo + '월</h3>' +
						'<span class="count">출근 <b>' + count + '</b>일</span></div>' +
						'<div class="dow"><i>일</i><i>월</i><i>화</i><i>수</i><i>목</i><i>금</i><i>토</i></div>' +
						'<div class="grid">' + cells.join('') + '</div></div>';

					return { html: head, count: count };
				}
			})();
		</script>
	</body>
</html>
